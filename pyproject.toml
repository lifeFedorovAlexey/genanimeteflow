[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["apps/api"]
include = ["app*"]

[project]
name = "character-factory"
version = "0.1.0"
description = "Local production pipeline foundation for Character Factory"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "Pillow>=10,<12",
  "psutil>=6,<7",
  "numpy>=2,<3",
  "nvidia-ml-py>=12,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
